name: Frontend CI

on:
  pull_request:
    branches: [main, feature/school-academic-structure-management, feature/school-student-management]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main, work, feature/school-attendance-management]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

jobs:
  build:
    name: TypeScript and Vite production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Install pinned Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
        working-directory: frontend
      - name: Install Chromium for browser acceptance tests
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run Student Management browser acceptance tests
        run: npx playwright test
        working-directory: frontend
