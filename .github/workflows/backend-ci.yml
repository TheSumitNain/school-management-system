name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Go tests, PostgreSQL integration, and vet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: school_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d school_management_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: school_management_test
      DB_SSLMODE: disable
      RUN_POSTGRES_INTEGRATION_TESTS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Apply all migrations to the ephemeral test database
        working-directory: backend
        run: go run ./cmd/migrate

      - name: Run backend tests including PostgreSQL integration
        working-directory: backend
        run: go test -count=1 -p 1 ./...

      - name: Run go vet
        working-directory: backend
        run: go vet ./...
